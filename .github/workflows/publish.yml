name: Publish to npm

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const v = 'v' + require('./package.json').version; if (v !== process.env.RELEASE_TAG) { console.error(\`Tag \${process.env.RELEASE_TAG} does not match package version \${v}\`); process.exit(1); }"
      - run: npm publish --provenance --access public
